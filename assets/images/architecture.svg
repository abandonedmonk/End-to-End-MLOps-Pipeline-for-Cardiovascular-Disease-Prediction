<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <style>
    .title{font: bold 16px sans-serif; fill:#0f172a}
    .box{fill:#f8fafc; stroke:#0f172a; stroke-opacity:0.08}
    .label{font: 12px sans-serif; fill:#0f172a}
    .arrow{stroke:#374151; stroke-width:2; fill:none}
  </style>
  <rect x="8" y="8" width="884" height="284" rx="8" fill="#ffffff" stroke="#e6eef8"/>
  <text x="20" y="30" class="title">Heart Disease Prediction — Architecture (simplified)</text>

  <rect class="box" x="24" y="60" width="220" height="80" rx="6"/>
  <text x="48" y="100" class="label">Developer Machine</text>

  <rect class="box" x="320" y="40" width="240" height="120" rx="6"/>
  <text x="350" y="80" class="label">GitHub Actions CI/CD</text>

  <rect class="box" x="620" y="60" width="240" height="100" rx="6"/>
  <text x="650" y="100" class="label">AWS: EC2 + RDS + S3 (MLflow, API)</text>

  <path class="arrow" d="M244 100 L320 100" marker-end="url(#a)"/>
  <path class="arrow" d="M560 100 L620 100" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="280" class="label">Diagram: developer → CI/CD → cloud deployment.</text>
</svg>
